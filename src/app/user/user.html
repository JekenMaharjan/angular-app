<div class="flex flex-col gap-10 items-center justify-center bg-slate-900 text-white min-h-dvh w-full p-5">
    <div class="flex flex-col bg-slate-700 p-5 rounded-md w-md">
        <h2 class="font-bold text-xl mb-4 text-center">User Form</h2>

        <!-- Add User Form -->
        <form (submit)="handleSubmit($event)" class="space-y-2">
            <!-- Name -->
            <div>
                <label class="block text-sm font-medium mb-1">Name</label>
                <input
                    [formField]="profileForm.name"
                    type="text"
                    class="w-full text-sm px-2 py-1 bg-slate-800 rounded border border-slate-700 focus:outline-none focus:border-blue-500"
                    placeholder="Enter name"
                />
            </div>

            <!-- Description -->
            <div>
                <label class="block text-sm font-medium mb-1">Description</label>
                <textarea
                    [formField]="profileForm.description"
                    class="w-full text-sm px-2 py-1 bg-slate-800 rounded border border-slate-700 focus:outline-none focus:border-blue-500"
                    placeholder="Enter description"
                    rows="3"
                >
                </textarea>
            </div>

            <!-- Form Submit Button -->
            <button
                type="submit"
                class="w-full py-1 text-sm bg-green-600 hover:bg-green-500 rounded font-semibold transition cursor-pointer"
            >
                Add User
            </button>
        </form>
    </div>

    <div class="flex flex-col bg-slate-800 rounded-md p-3">
        <h2 class="text-center text-xl font-semibold mb-4">Users</h2>

        <div class="grid grid-cols-3 gap-3">
            @for (p of profiles(); track p.id) {
            <div class="flex flex-col border justify-between border-slate-500 p-2 rounded-md mb-2">
                <div class="flex flex-col">
                    <h3 class="text-center font-semibold">{{ p.name }}</h3>
                    <p class="text-sm">{{ p.description }}</p>
                </div>

                <div class="flex flex-col gap-3">
                    <button
                        type="button"
                        (click)="startEdit(p)"
                        class="w-full py-1 text-sm bg-blue-600 hover:bg-blue-500 rounded font-semibold transition cursor-pointer"
                    >
                        Update
                    </button>

                    <button
                        type="button"
                        (click)="onDelete(p.id)"
                        class="w-full py-1 text-sm bg-red-600 hover:bg-red-500 rounded font-semibold transition cursor-pointer"
                    >
                        Delete
                    </button>
                </div>
            </div>

            @if (isPopupOpen()) {
                <div class="fixed top-0 left-0 w-screen h-screen flex justify-center items-center backdrop-blur-md">
                    <div class="flex flex-col bg-slate-700 p-5 rounded-md w-md">
                        <h2 class="font-bold text-xl mb-4 text-center">Update User Form</h2>

                        <!-- Update User Form -->
                        <form (submit)="onUpdate($event)" class="space-y-2">
                            <!-- Name -->
                            <div>
                                <label class="block text-sm font-medium mb-1">Name</label>
                                <input
                                    [formField]="profileForm.name"
                                    type="text"
                                    class="w-full text-sm px-2 py-1 bg-slate-800 rounded border border-slate-700 focus:outline-none focus:border-blue-500"
                                    placeholder="Enter name"
                                />
                            </div>

                            <!-- Description -->
                            <div>
                                <label class="block text-sm font-medium mb-1">Description</label>
                                <textarea
                                    [formField]="profileForm.description"
                                    class="w-full text-sm px-2 py-1 bg-slate-800 rounded border border-slate-700 focus:outline-none focus:border-blue-500"
                                    placeholder="Enter description"
                                    rows="3"
                                >
                                </textarea>
                            </div>

                            <div class="flex gap-3 justify-end">
                                <!-- Form Submit Button -->
                                <button
                                    type="submit"
                                    class="py-1 px-3 text-sm bg-blue-600 hover:bg-blue-500 rounded font-semibold transition cursor-pointer"
                                >
                                    Update
                                </button>

                                <button
                                    (click)="togglePopup(false)"
                                    class="py-1 px-3 text-sm bg-red-600 hover:bg-red-500 rounded font-semibold transition cursor-pointer"
                                >
                                    Close
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            }
            }
        </div>
    </div>
</div>
