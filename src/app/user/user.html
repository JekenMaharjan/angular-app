<div class="flex items-center justify-center bg-slate-900 text-white min-h-dvh w-full p-5">
    <div class="flex flex-col bg-slate-700 p-5 rounded-md w-md">
        <h2 class="font-bold text-xl mb-4 text-center">User Form</h2>
    
        <!-- Add User Form -->
        <form (submit)="handleSubmit($event)" class="space-y-4">
            <!-- Name -->
            <div>
                <label class="block text-sm font-medium mb-1">Name</label>
                <input
                    [formField]="profileForm.name"
                    type="text"
                    class="w-full px-3 py-2 bg-slate-800 rounded border border-slate-700 focus:outline-none focus:border-blue-500"
                    placeholder="Enter name"
                />
            </div>

            <!-- Description -->
            <div>
                <label class="block text-sm font-medium mb-1">Description</label>
                <textarea
                    [formField]="profileForm.description"
                    class="w-full px-3 py-2 bg-slate-800 rounded border border-slate-700 focus:outline-none focus:border-blue-500"
                    placeholder="Enter description"
                    rows="4"
                >
                </textarea>
            </div>

            <!-- Form Submit Button -->
            <button
                type="submit"
                class="w-full py-2 bg-blue-600 hover:bg-blue-500 rounded font-semibold transition cursor-pointer"
            >
                Submit Form
            </button>
        </form>
    </div>
</div>
